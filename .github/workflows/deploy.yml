name: deploy

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static site
        uses: actions/checkout@v4

      - name: Publish static files to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          expected=$(git rev-parse refs/remotes/origin/gh-pages)
          git push --force-with-lease="refs/heads/gh-pages:$expected" origin HEAD:refs/heads/gh-pages
