- title: Experience
  type: time_table
  contents:
    - title: Software Engineer — Agentic Systems & LLM Platforms (Adobe Brand Concierge)
      institution: Adobe, Santa Clara, CA
      year: Late 2024 - Present
      description:
        - title: Core platform engineering for Adobe Brand Concierge, supporting enterprise deployments across semiconductors & hardware, enterprise SaaS, retail, travel & hospitality, and sports/entertainment.
          contents:
            - Primary creator and builder of the offline and online LLM evaluation and optimization platform (FastAPI, Okta SSO), integrating GEPA reflective prompt and judge optimization, multi-judge correlation diagnostics, guardrail analysis, and offline source-attribution calibration.
            - Engineered durable SQL Server dataset persistence with chunked staging tables, bulk row ingestion, and paginated retrieval scaling up to 50,000-answer datasets alongside replay evaluation runners.
            - Co-built the foundational FastAPI/MongoDB conversation runtime from day one, including conversation APIs, session-store facades, SSE streaming contracts, A2A streaming client integration, tenant traffic/sandbox isolation, and web-traffic/engagement analytics ingestion.
            - Built the Pydantic tool configuration hierarchy with declarative pre/post execution hooks, state capture primitives, configurable error-recovery policies, and MCP tool integration in the successor PydanticAI runtime.
            - Added manifest-driven runtime LLM profile routing across Azure OpenAI, OpenAI, and private enterprise model endpoints.
            - Implemented the document-first LLM citation pipeline and remote source-attribution integration with cross-turn citation tracking, multi-layered preflight decision guardrails, tool-graph-aware system skills, and structured execution trace contracts.
            - Extended the CPU Text Embeddings Inference (TEI) / ONNX Runtime stack with INT8 quantization pipelines, custom E5 cross-encoder and two-stage embedding build targets, and a FastAPI multi-query batch reranking proxy.
            - Contributed to early Brand Concierge web crawling and LLM-as-a-judge evaluation services.

    - title: Software Engineer — Adobe Journey Optimizer (AJO)
      institution: Adobe, Santa Clara, CA
      year: Jun 2023 - Nov 2024
      description:
        - title: Backend engineering, production runtime operations, and architectural design for Adobe Journey Optimizer authoring and execution systems.
          contents:
            - Built Java authoring and validation APIs for Campaign/Journey Conflict Detection, integrating Accelerated Query Service (AQS) audience-overlap scoring, OLAC-aware campaign caching, and channel, ruleset, and business-event filtering.
            - Handled production on-call, infrastructure debugging, and scaling for the AJO journey runtime; contributed technical proposals for message/journey prioritization features and runtime SDK integration for inbound channels (code-based experiences and content cards).
            - Implemented merge-policy lifecycle handling across draft, live, and duplicated journey versions and asynchronous test-mode execution endpoints.

    - title: Software Engineer
      institution: TruckX, Sunnyvale, CA
      year: Jul 2022 - Jun 2023
      description:
        - Engineered resilient event-driven microservices processing high-frequency real-time IoT vehicle telemetry data at scale.
        - Devised end-to-end telemetry solutions to track remote driving behaviors and enforce regulatory Hours-of-Service (HOS) compliance.
        - Led the core engineering team in the successful architecture and production launch of ELD (Electronic Logging Device) trackers for the Canadian market.

    - title: Graduate Student Researcher
      institution: University of California, Irvine (Advisor - Dr. Sameer Singh)
      year: Jun 2022 - Jun 2023
      description:
        - Investigated in-context learning robustness, prompt sensitivity, and chain-of-thought reasoning consistency in Large Language Models.
        - Developed EchoPrompt, instructing models to rephrase queries prior to reasoning, substantially improving few-shot arithmetic and logical reasoning performance across LLMs (Published at NAACL / ARR).
        - Co-developed Snoopy, an interactive diagnostic framework exploring the causal impact of pretraining term frequencies on few-shot language model outputs (Published at EMNLP 2022).

