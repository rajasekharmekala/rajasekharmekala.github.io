- title: Experience
  type: time_table
  contents:
    - title: Software Engineer — Generative AI Platforms & Agent Systems
      institution: Adobe, Santa Clara, CA
      year: Jun 2023 - Present
      description:
        - title: Architecting core runtime systems, neural retrieval engines, and automated optimization platforms for Adobe Brand Concierge (and Adobe Journey Optimizer).
          contents:
            - Architected the unified Brand Concierge Operating System (BCOS) using PydanticAI, replacing multi-hop legacy pipelines with a single high-performance agent runtime supporting declarative manifest compilation and A2A JSON-RPC protocols.
            - Designed an extensible Pydantic tool configuration subsystem with declarative pre/post execution hooks, state capture primitives, and configurable ToolErrorPolicy for deterministic error recovery.
            - Engineered a factory-based source attribution and citation engine integrating remote cross-encoder rerankers (bge-reranker-v2-m3, e5-curriculum), client-side normalization, token truncation safeguards (<512 tokens), and dynamic request batching across enterprise pilots (NVIDIA, Synopsys, ITC, DSG).
            - Built CPU-only Text Embeddings Inference (TEI) microservices on ONNX Runtime (ORT) with dynamic axes, eliminating Candle batching limits to rerank 30+ candidate passages in a single batch with sub-second p50 latency (588ms–796ms).
            - Built a dynamic named LLM profile system enabling zero-downtime, manifest-driven runtime model routing across Azure OpenAI (GPT-4.1 / GPT-4o), OpenAI, and private enterprise model endpoints.
            - Integrated Genetic-Pareto Prompt Optimization (GEPA) and DSPy into Eval Studio for reflective prompt compilation, achieving Pareto-optimal prompt mutations with 35x fewer rollouts than RL baselines.
            - Developed high-throughput MSSQL dataset persistence with chunked staging tables, bulk row ingestion, real-time build progress tracking, and span-aware execution trace evaluators.
            - Hardened core FastAPI/MongoDB conversation engine with Server-Sent Events (SSE) token streaming, artifact state replacement (StreamEventProcessor), and sandbox isolation (TrafficControlEnforcer).
            - Engineered a standalone Q&A routing cache using local fastembed (bge-small) and semantic clustering over historical interaction logs to serve recurring brand queries with sub-millisecond lookups.

